# B3：基本 CI — 跨平台檢查與 Windows 桌面測試分流，把關回歸。
# 不跑 electron-builder dist：ffmpeg/mpv 二進位已被 .gitignore 排除，且打包屬發版步驟。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  portable:
    name: 跨平台驗證
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci:portable
      - run: npm run build

  windows-desktop:
    name: Windows 桌面驗證
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:ci:windows
