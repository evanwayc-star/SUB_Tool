# B3：基本 CI — 跨平台檢查與 Windows 桌面測試分流，把關回歸。
# 不跑 electron-builder dist：ffmpeg/mpv 二進位已被 .gitignore 排除，且打包屬發版步驟。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  portable:
    name: 跨平台驗證
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci:portable
      - run: npm run build

  windows-desktop:
    name: Windows 桌面驗證
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Match the packaged full build: ffmpeg-static lacks libtwolame/CRC.
      - name: Prepare full FFmpeg for airline acceptance
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-full.7z'
          $toolsDir = Join-Path $env:RUNNER_TEMP 'ffmpeg-full'
          Invoke-WebRequest -Uri 'https://github.com/GyanD/codexffmpeg/releases/download/2026-01-22-git-4561fc5e48/ffmpeg-2026-01-22-git-4561fc5e48-full_build.7z' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '70ad2ba7636385b4f00f16893768add38956e9e40608200a3283b0be8c510a93') { throw 'FFmpeg archive checksum mismatch' }
          7z x $archive "-o$toolsDir" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg extraction failed' }
          $ffmpeg = @(Get-ChildItem -LiteralPath $toolsDir -Filter ffmpeg.exe -File -Recurse)
          if ($ffmpeg.Count -ne 1) { throw 'Expected one FFmpeg binary' }
          $ffprobe = Join-Path $ffmpeg[0].DirectoryName 'ffprobe.exe'
          if (-not (Test-Path -LiteralPath $ffprobe)) { throw 'FFprobe missing' }
          "FFMPEG_PATH=$($ffmpeg[0].FullName)" | Add-Content -LiteralPath $env:GITHUB_ENV
          "FFPROBE_PATH=$ffprobe" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Prepare pinned Rust and verified FFmpeg for screen text
        shell: pwsh
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          rustup override set 1.100.0
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain override failed' }
          New-Item -ItemType Directory -Force electron/ffmpeg | Out-Null
          Copy-Item -LiteralPath $env:FFMPEG_PATH, $env:FFPROBE_PATH -Destination electron/ffmpeg
      # Test builds refuse HTTP; this verifies source frames and cache contracts without cloud calls.
      - name: Test screen text native engine offline
        run: npm run test:card-vision
      - name: Build screen text release engine
        run: npm run native:prepare:card-vision
      - name: Prepare verified DVD and BD authoring tools
        run: npm run native:prepare:disc
      - run: npm run build
      - name: Stage bundled Windows tools for package verification
        if: github.head_ref == 'verify/nas-media-windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mpv-x64.7z'
          $dir = Join-Path $env:RUNNER_TEMP 'mpv-x64'
          Invoke-WebRequest 'https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261111/mpv-x86_64-20261111-git-bcde6b93cc.7z' -OutFile $archive
          if ((Get-FileHash $archive).Hash -ne 'f259b5fd4b5c395617c948a4fadcdf55bba1c5282fb7c13e88626b3f71072baf') { throw 'mpv archive checksum mismatch' }
          7z x $archive "-o$dir" -y | Out-Null
          if ($LASTEXITCODE) { throw 'mpv extraction failed' }
          New-Item -ItemType Directory -Force electron/ffmpeg, electron/mpv | Out-Null
          Copy-Item $env:FFMPEG_PATH, $env:FFPROBE_PATH electron/ffmpeg
          $mpv = Get-ChildItem $dir -Recurse -File -Filter mpv.exe | Select-Object -First 1
          Copy-Item $mpv.FullName electron/mpv
          $dll = Get-ChildItem $dir -Recurse -File -Filter d3dcompiler_43.dll | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName electron/mpv } else { Copy-Item "$env:SystemRoot/System32/d3dcompiler_43.dll" electron/mpv }
      - name: Run portable tests on Windows for NAS verification
        if: github.head_ref == 'verify/nas-media-windows'
        run: npm run test:ci:portable
      - if: success() || failure()
        run: npm run test:ci:windows
