<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>匯出佇列監控</title>
  <style>
    :root {
      --bg: #101216;
      --surface: #171a1f;
      --surface-raised: #1d2128;
      --surface-hover: #242a33;
      --border: #2c333d;
      --border-strong: #414b58;
      --text: #f1f4f8;
      --text-dim: #9ca6b4;
      --text-muted: #727d8c;
      --accent: #3a9df5;
      --accent-bg: rgba(58, 157, 245, 0.14);
      --success: #38c978;
      --success-bg: rgba(56, 201, 120, 0.12);
      --warn: #f4ad35;
      --warn-bg: rgba(244, 173, 53, 0.12);
      --error: #ff697c;
      --error-bg: rgba(255, 105, 124, 0.12);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      margin: 0;
      padding: 18px 22px 22px;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #39414d; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #4a5564; }

    h2, h3, p { margin: 0; }
    .header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 13px;
      border-bottom: 1px solid var(--border);
    }
    .header-title { min-width: 0; }
    .eyebrow {
      margin-bottom: 4px;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .title-line {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
    }
    h2 {
      color: #fff;
      font-size: 19px;
      font-weight: 650;
      letter-spacing: -.02em;
    }
    .queue-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      font-size: 11px;
    }
    .queue-stat {
      display: inline-flex;
      gap: 5px;
      align-items: baseline;
      padding: 3px 7px;
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255, 255, 255, .025);
    }
    .queue-stat b {
      color: var(--text);
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 12px;
    }
    .queue-stat--active b { color: var(--accent); }
    .queue-stat--waiting b { color: var(--warn); }
    .queue-stat--attention b { color: var(--error); }
    .queue-stat--completed b { color: var(--success); }

    .controls { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; justify-content: flex-end; }
    button {
      min-height: 30px;
      padding: 5px 10px;
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-raised);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      transition: background .16s ease, border-color .16s ease, color .16s ease;
    }
    button:hover { border-color: var(--border-strong); background: var(--surface-hover); }
    button:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    button.primary { border-color: var(--accent); background: var(--accent); color: #061725; }
    button.primary:hover { background: #63b4f8; border-color: #63b4f8; }
    button[disabled] { opacity: .45; cursor: not-allowed; }
    .concurrency-control {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      min-height: 30px;
      padding: 0 8px;
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 6px;
      background: rgba(255,255,255,.02);
      font-size: 12px;
      white-space: nowrap;
    }
    /* color-scheme: dark 是關鍵：展開後的 <option> 清單是作業系統畫的，
       不吃這裡的 CSS。少了它，深色介面上會彈出白底選單、選項幾乎看不見。
       background 也不能留 transparent——收合狀態下同樣會被系統畫成淺色。 */
    select {
      min-height: 24px;
      padding: 2px 17px 2px 5px;
      border: 0;
      border-radius: 4px;
      outline: none;
      background: var(--surface-raised);
      color: var(--text);
      font: inherit;
      color-scheme: dark;
    }
    select option {
      background: var(--surface-raised);
      color: var(--text);
    }

    .warning {
      display: flex;
      gap: 8px;
      align-items: center;
      min-height: 34px;
      margin-bottom: 10px;
      padding: 7px 10px;
      color: #f6c354;
      border: 1px solid rgba(244, 173, 53, .36);
      border-radius: 7px;
      background: var(--warn-bg);
      font-size: 12px;
    }
    .warning[hidden] { display: none; }

    .queue-workspace {
      display: flex;
      flex: 0 1 auto;
      flex-direction: column;
      min-height: 0;
      gap: 10px;
    }
    .work-panel {
      display: block;
      max-height: min(58vh, 520px);
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }
    .panel-heading {
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
      min-height: 56px;
      padding: 11px 14px 10px;
      border-bottom: 1px solid var(--border);
    }
    .panel-heading-main { min-width: 0; }
    .panel-heading-title {
      display: flex;
      gap: 8px;
      align-items: center;
      color: #fff;
      font-size: 14px;
      font-weight: 650;
    }
    .panel-heading-title::before {
      width: 7px;
      height: 7px;
      content: "";
      border-radius: 50%;
      background: var(--warn);
      box-shadow: 0 0 12px rgba(244, 173, 53, .65);
    }
    .panel-count {
      min-width: 22px;
      padding: 2px 7px;
      color: var(--warn);
      border: 1px solid rgba(244, 173, 53, .3);
      border-radius: 999px;
      background: var(--warn-bg);
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 11px;
      text-align: center;
    }
    .panel-heading-copy { margin-top: 3px; color: var(--text-muted); font-size: 11px; }
    .drag-hint { color: var(--text-muted); font-size: 11px; white-space: nowrap; }

    .job-list { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .job-list--active {
      max-height: min(max(130px, calc(58vh - 57px)), 463px);
      padding: 8px;
      overflow-y: auto;
    }
    .queue-empty {
      display: grid;
      min-height: 108px;
      place-items: center;
      padding: 18px;
      color: var(--text-muted);
      border: 1px dashed var(--border-strong);
      border-radius: 7px;
      font-size: 12px;
      text-align: center;
    }

    .job {
      display: grid;
      min-width: 0;
      grid-template-areas: "main progress actions" "error error error";
      grid-template-columns: minmax(210px, 1fr) minmax(260px, 1.2fr) auto;
      gap: 7px 14px;
      align-items: center;
      min-height: 66px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-raised);
      transition: border-color .16s ease, background .16s ease;
    }
    .job:hover { border-color: var(--border-strong); background: var(--surface-hover); }
    .job--compact { min-height: 50px; padding-block: 8px; }
    .job-main { grid-area: main; min-width: 0; }
    .job-header { display: flex; gap: 9px; align-items: center; min-width: 0; }
    .job-title {
      min-width: 0;
      overflow: hidden;
      color: #fff;
      font-size: 13px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .job-meta {
      overflow: hidden;
      margin-top: 3px;
      color: var(--text-muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .job-status {
      display: inline-flex;
      flex: 0 0 auto;
      gap: 5px;
      align-items: center;
      padding: 3px 6px;
      color: var(--text-dim);
      border-radius: 4px;
      background: rgba(255,255,255,.045);
      font-size: 11px;
      font-weight: 650;
      white-space: nowrap;
    }
    .job-duration {
      display: inline-flex;
      flex: 0 0 auto;
      gap: 4px;
      align-items: center;
      padding: 3px 6px;
      color: var(--text-muted);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 4px;
      background: rgba(255,255,255,.025);
      font-size: 10px;
      line-height: 1;
      white-space: nowrap;
    }
    .job-duration b { color: var(--text-dim); font-family: "Cascadia Mono", Consolas, monospace; font-weight: 650; }
    .job-progress { grid-area: progress; min-width: 0; }
    .progress-bar-bg {
      position: relative;
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: #0d0f13;
      box-shadow: inset 0 1px 1px rgba(0,0,0,.35);
    }
    .progress-bar-fill { height: 100%; transition: width .32s ease; }
    .job-timing {
      display: flex;
      flex-wrap: wrap;
      gap: 3px 9px;
      margin-top: 5px;
      color: var(--text-muted);
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 10px;
    }
    .job-timing-item { white-space: nowrap; }
    .job-timing-item b { color: var(--text-dim); font-weight: 600; }
    .job-actions { display: flex; grid-area: actions; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
    .job-actions button { min-height: 28px; padding: 4px 8px; }
    .job-main, .job-progress { pointer-events: none; } /* Prevent drag flickering */
    .job--compact .job-progress { display: none; }
    .job--compact .job-actions { grid-column: 3; }

    .job.status-running { border-color: rgba(58, 157, 245, .42); }
    .job.status-running .job-status { color: #79beff; background: var(--accent-bg); }
    .job.status-running .progress-bar-fill { background: linear-gradient(90deg, var(--accent), #6fc2ff); }
    .job.status-stopping .job-status, .job.status-stopped .job-status { color: #f6c354; background: var(--warn-bg); }
    .job.status-done .job-status { color: var(--success); background: var(--success-bg); }
    .job.status-failed, .job.status-missing-source { border-color: rgba(255,105,124,.35); }
    .job.status-failed .job-status, .job.status-missing-source .job-status { color: var(--error); background: var(--error-bg); }

    .error-box {
      grid-area: error;
      margin-top: 2px;
      padding: 7px 9px;
      color: #ffabb6;
      border: 1px solid rgba(255,105,124,.28);
      border-radius: 6px;
      background: var(--error-bg);
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 11px;
    }
    .error-box summary { cursor: pointer; color: #ffabb6; font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; font-weight: 650; }
    .error-detail { margin-top: 7px; white-space: pre-wrap; user-select: text; }
    .error-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
    .error-actions button { min-height: 25px; padding: 3px 7px; font-size: 11px; }

    .completed-history {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }
    .completed-history summary {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      min-height: 37px;
      padding: 8px 12px;
      cursor: pointer;
      color: var(--text-dim);
      font-size: 12px;
      list-style: none;
    }
    .completed-history summary::-webkit-details-marker { display: none; }
    .completed-history summary::after { content: "展開"; color: var(--text-muted); font-size: 11px; }
    .completed-history[open] summary { border-bottom: 1px solid var(--border); }
    .completed-history[open] summary::after { content: "收合"; }
    .completed-title { display: inline-flex; gap: 7px; align-items: center; }
    .completed-title::before { width: 7px; height: 7px; content: ""; border-radius: 50%; background: var(--success); }
    .completed-history .job-list { max-height: min(28vh, 210px); padding: 7px; overflow-y: auto; }
    .completed-history .job { min-height: 46px; padding-block: 7px; }

    .job[draggable="true"] { cursor: grab; }
    .job[draggable="true"]:active { cursor: grabbing; }
    .job.dragging { opacity: .42; }
    .job.drop-above { border-top: 2px solid var(--accent); }
    .job.drop-below { border-bottom: 2px solid var(--accent); }
    .icon { width: 13px; height: 13px; fill: currentColor; }

    @keyframes pulse { 50% { opacity: .48; } }
    .status-running .status-icon { animation: pulse 1.4s ease-in-out infinite; }

    @media (max-width: 980px) {
      body { height: auto; min-height: 100vh; overflow-y: auto; }
      .header { grid-template-columns: 1fr; }
      .controls { justify-content: flex-start; }
      .queue-workspace { flex: 0 1 auto; min-height: 0; }
      .job { grid-template-areas: "main actions" "progress progress" "error error"; grid-template-columns: minmax(0, 1fr) auto; }
      .job--compact .job-actions { grid-column: 2; }
    }

    @media (max-width: 620px) {
      body { padding: 14px; }
      .title-line { gap: 8px; }
      .queue-stats { width: 100%; }
      .drag-hint { display: none; }
      .job { grid-template-areas: "main" "progress" "actions" "error"; grid-template-columns: minmax(0, 1fr); }
      .job-actions { grid-column: 1; justify-content: flex-start; }
      .job--compact .job-actions { grid-column: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-title">
      <p class="eyebrow">交付工作台</p>
      <div class="title-line">
        <h2>匯出佇列監控</h2>
        <div class="queue-stats" aria-label="佇列摘要">
          <span class="queue-stat queue-stat--active"><b id="activeCount">0</b> 處理中</span>
          <span class="queue-stat queue-stat--waiting"><b id="waitingCount">0</b> 等待</span>
          <span class="queue-stat queue-stat--attention"><b id="attentionCount">0</b> 需處理</span>
          <span class="queue-stat queue-stat--completed"><b id="completedSummaryCount">0</b> 完成</span>
        </div>
      </div>
    </div>
    <div class="controls">
      <button id="showMainWindowBtn">開啟主視窗</button>
      <label class="concurrency-control" title="並行通常不會更快，因為多次讀取同一個來源素材會讓磁碟效能下降。">
        並行
        <select id="concurrencySel" aria-label="並行數">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </label>
      <button id="clearCompletedBtn">清除完成</button>
      <button id="pauseToggleBtn">暫停佇列</button>
    </div>
  </header>
  <div class="warning" id="queueWarning" role="status" hidden>
    <svg class="icon" viewBox="0 0 24 24"><path d="M11,9H13V7H11M12,20C7.59,20 4,16.41 4,12C4,7.59 7.59,4 12,4C16.41,4 20,7.59 20,12C20,16.41 16.41,20 12,20M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M11,17H13V11H11V17Z"/></svg>
    匯出中，背景轉碼可能會使預覽發生卡頓。
  </div>
  
  <main class="queue-workspace" id="queueBoard">
    <section class="work-panel" aria-labelledby="unfinishedHeading">
      <div class="panel-heading">
        <div class="panel-heading-main">
          <h3 class="panel-heading-title" id="unfinishedHeading">
            工作佇列
            <span class="panel-count" id="unfinishedCount" aria-label="未完成工作數">0</span>
          </h3>
          <p class="panel-heading-copy">執行中、等待中，或需要處理的工作</p>
        </div>
        <span class="drag-hint">可拖曳等待中的工作調整順序</span>
      </div>
      <div class="job-list job-list--active" id="unfinishedJobList"></div>
    </section>

    <details class="completed-history" id="completedHistory" hidden>
      <summary>
        <span class="completed-title">
          已完成
          <span id="completedCount" aria-label="已完成工作數">0</span>
        </span>
      </summary>
      <div class="job-list" id="completedJobList"></div>
    </details>
  </main>

  <script>
    const UI = {
      board: document.getElementById('queueBoard'),
      completedList: document.getElementById('completedJobList'),
      unfinishedList: document.getElementById('unfinishedJobList'),
      completedCount: document.getElementById('completedCount'),
      completedSummaryCount: document.getElementById('completedSummaryCount'),
      unfinishedCount: document.getElementById('unfinishedCount'),
      activeCount: document.getElementById('activeCount'),
      waitingCount: document.getElementById('waitingCount'),
      attentionCount: document.getElementById('attentionCount'),
      completedHistory: document.getElementById('completedHistory'),
      warning: document.getElementById('queueWarning'),
      showMainWindowBtn: document.getElementById('showMainWindowBtn'),
      pauseBtn: document.getElementById('pauseToggleBtn'),
      clearCompletedBtn: document.getElementById('clearCompletedBtn'),
      concurrencySel: document.getElementById('concurrencySel')
    };

    let _isPaused = false;
    let _jobs = [];
    let _isDragging = false;

    // Format seconds
    const fmt = s => {
      if (s === null || s === undefined || isNaN(s)) return '估算中';
      return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
    };
    const fmtCompletedAt = value => {
      const timestamp = Number(value);
      if (!Number.isFinite(timestamp) || timestamp <= 0) return '';
      const date = new Date(timestamp);
      if (Number.isNaN(date.getTime())) return '';
      const hour = date.getHours();
      const period = hour >= 12 ? 'PM' : 'AM';
      const hour12 = hour % 12 || 12;
      return `${date.getMonth() + 1}月${date.getDate()}日 · ${String(hour12).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')} ${period}`;
    };
    const fmtOutputDuration = value => {
      const duration = Number(value);
      if (!Number.isFinite(duration) || duration < 0) return '';
      const totalMilliseconds = Math.round(duration * 1000);
      const totalSeconds = Math.floor(totalMilliseconds / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      const base = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      const fraction = totalMilliseconds % 1000;
      return fraction ? `${base}.${String(fraction).padStart(3, '0').replace(/0+$/, '')}` : base;
    };
    const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[char]);
    const finiteNumber = value => Number.isFinite(Number(value)) ? Number(value) : 0;

    const ICONS = {
      queued: '<svg class="icon" viewBox="0 0 24 24"><path d="M12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22C6.47,22 2,17.5 2,12A10,10 0 0,1 12,2M12.5,7V12.25L17,14.92L16.25,16.15L11,13V7H12.5Z"/></svg>',
      running: '<svg class="icon status-icon" viewBox="0 0 24 24"><path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,10.5A1.5,1.5 0 0,0 10.5,12A1.5,1.5 0 0,0 12,13.5A1.5,1.5 0 0,0 13.5,12A1.5,1.5 0 0,0 12,10.5Z"/></svg>',
      done: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12S6.5 22 12 22 22 17.5 22 12 17.5 2 12 2M10 17L5 12L6.41 10.59L10 14.17L17.59 6.58L19 8L10 17Z"/></svg>',
      failed: '<svg class="icon" viewBox="0 0 24 24"><path d="M12,2C17.53,2 22,6.47 22,12C22,17.53 17.53,22 12,22C6.47,22 2,17.53 2,12C2,6.47 6.47,2 12,2M15.59,7L12,10.59L8.41,7L7,8.41L10.59,12L7,15.59L8.41,17L12,13.41L15.59,17L17,15.59L13.41,12L17,8.41L15.59,7Z"/></svg>',
      stopped: '<svg class="icon" viewBox="0 0 24 24"><path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M9,9H15V15H9V9Z"/></svg>'
    };

    function emptyState(message) {
      const empty = document.createElement('div');
      empty.className = 'queue-empty';
      empty.textContent = message;
      return empty;
    }

    function createJobCard(job, index) {
        const el = document.createElement('div');
        const isRunning = job.status === 'running';
        el.className = 'job status-' + job.status + (isRunning ? '' : ' job--compact');
        el.dataset.jobId = job.id;
        el.dataset.status = job.status;
        el.dataset.index = index;
        
        if (job.status === 'queued') {
          el.draggable = true;
          el.addEventListener('dragstart', handleDragStart);
          el.addEventListener('dragenter', handleDragEnter);
          el.addEventListener('dragover', handleDragOver);
          el.addEventListener('dragleave', handleDragLeave);
          el.addEventListener('drop', handleDrop);
          el.addEventListener('dragend', handleDragEnd);
        }
        
        const pctValue = finiteNumber(job.pct);
        let statusText = job.status;
        let icon = ICONS.queued;
        if (job.status === 'queued') { statusText = '等待中'; icon = ICONS.queued; }
        if (job.status === 'running') { statusText = '執行中 ' + pctValue.toFixed(1) + '%'; icon = ICONS.running; }
        if (job.status === 'stopping') { statusText = '停止中'; icon = ICONS.stopped; }
        if (job.status === 'done') { statusText = '完成'; icon = ICONS.done; }
        if (job.status === 'failed') { statusText = '失敗'; icon = ICONS.failed; }
        if (job.status === 'missing-source') { statusText = '來源遺失'; icon = ICONS.failed; }
        if (job.status === 'stopped') { statusText = '已停止'; icon = ICONS.stopped; }
        
        const pctNum = Math.max(0, Math.min(100, pctValue));
        let timingHtml = '';
        let metaText = '等待執行；可拖曳調整順序';
        if (job.status === 'running') {
          const elS = Math.floor(finiteNumber(job.elapsedMs) / 1000);
          const etaS = Math.floor(finiteNumber(job.etaS));
          const totalS = elS + etaS;
          metaText = '正在轉碼；進度會隨 ffmpeg 更新';
          timingHtml = `<div class="job-timing">
            <span class="job-timing-item">已 <b>${fmt(elS)}</b></span>
            <span class="job-timing-item">剩 <b>${fmt(etaS)}</b></span>
            <span class="job-timing-item">預計 <b>${fmt(totalS)}</b></span>
          </div>`;
        } else if (job.status === 'stopping') {
          metaText = '正在結束轉碼程序';
        } else if (job.status === 'done') {
          const elS = Math.floor(finiteNumber(job.elapsedMs) / 1000);
          const completedAt = fmtCompletedAt(job.completedAt);
          metaText = completedAt ? `完成於 ${completedAt} · 花費 ${fmt(elS)}` : `完成花費 ${fmt(elS)}`;
        } else if (job.status === 'failed') {
          metaText = '匯出失敗，請查看錯誤詳情或重試';
        } else if (job.status === 'missing-source') {
          metaText = '找不到來源素材，確認路徑後可重試';
        } else if (job.status === 'stopped') {
          metaText = '這份工作已停止，可重試或清除紀錄';
        }

        const outPath = String(job.payload?.outPath || '');
        const outName = outPath.split(/[\\/]/).pop() || '未命名輸出';
        const outputDuration = fmtOutputDuration(job.payload?.duration);
        const outputDurationLabel = outputDuration || '—';
        const outputDurationTitle = outputDuration ? `輸出時長：${outputDuration}` : '輸出時長：尚未取得';
        
        let errorHtml = '';
        let errorMessage = '';
        let logPath = null;
        if (job.errorMsg) {
          errorMessage = String(job.errorMsg);
          const m = errorMessage.match(/\[LOG_PATH\](.*?)\[\/LOG_PATH\]/);
          if (m) {
            logPath = m[1];
            errorMessage = errorMessage.replace(/\[LOG_PATH\].*?\[\/LOG_PATH\]/, '').trim();
          }
          errorHtml = `<details class="error-box">
            <summary>查看錯誤詳情</summary>
            <div class="error-detail">${escapeHTML(errorMessage)}</div>
            <div class="error-actions">
              <button type="button" data-action="copy-error">複製錯誤</button>
              ${logPath ? '<button type="button" data-action="open-log">開啟完整記錄</button>' : ''}
            </div>
          </details>`;
        }

        let actionHtml = '';
        if (job.status === 'running' || job.status === 'queued') {
          actionHtml += '<button type="button" data-action="stop">停止</button>';
        }
        if (job.status === 'failed' || job.status === 'missing-source' || job.status === 'stopped') {
          actionHtml += '<button type="button" class="primary" data-action="retry">重試</button>';
        }
        if (job.status === 'done' || job.status === 'failed' || job.status === 'missing-source' || job.status === 'stopped') {
          actionHtml += '<button type="button" data-action="clear">清除紀錄</button>';
        }
        if (job.status === 'done') {
          actionHtml += '<button type="button" class="primary" data-action="show-output">打開資料夾</button>';
        }

        el.innerHTML = `
          <div class="job-main">
            <div class="job-header">
              <span class="job-title" title="${escapeHTML(outName)}">${escapeHTML(outName)}</span>
              <span class="job-status">${icon} ${escapeHTML(statusText)}</span>
              <span class="job-duration" title="${escapeHTML(outputDurationTitle)}" aria-label="${escapeHTML(outputDurationTitle)}">時長 <b>${escapeHTML(outputDurationLabel)}</b></span>
            </div>
            ${job.status === 'queued' ? '' : `<p class="job-meta">${escapeHTML(metaText)}</p>`}
          </div>
          ${isRunning ? `
            <div class="job-progress">
              <div class="progress-bar-bg" role="progressbar" aria-label="${escapeHTML(outName)} 進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pctNum.toFixed(1)}">
                <div class="progress-bar-fill" style="width:${pctNum}%;"></div>
              </div>
              ${timingHtml}
            </div>
          ` : ''}
          <div class="job-actions">${actionHtml}</div>
          ${errorHtml}
        `;
        el.querySelector('[data-action="stop"]')?.addEventListener('click', () => window.queueAPI.stopJob(job.id));
        el.querySelector('[data-action="retry"]')?.addEventListener('click', () => window.queueAPI.retryJob(job.id));
        el.querySelector('[data-action="clear"]')?.addEventListener('click', () => window.queueAPI.clearJob(job.id));
        el.querySelector('[data-action="show-output"]')?.addEventListener('click', () => window.queueAPI.showItemInFolder(outPath));
        el.querySelector('[data-action="open-log"]')?.addEventListener('click', () => window.queueAPI.openPath(logPath));
        el.querySelector('[data-action="copy-error"]')?.addEventListener('click', async event => {
          await navigator.clipboard.writeText(errorMessage);
          const button = event.currentTarget;
          button.textContent = '已複製！';
          setTimeout(() => { button.textContent = '複製錯誤'; }, 2000);
        });
        return el;
    }

    function renderJobs() {
      if (_isDragging) return;
      const completed = _jobs.filter(job => job.status === 'done');
      const unfinished = _jobs.filter(job => job.status !== 'done');
      const active = unfinished.filter(job => job.status === 'running' || job.status === 'stopping');
      const waiting = unfinished.filter(job => job.status === 'queued');
      const attention = unfinished.filter(job => !['running', 'stopping', 'queued'].includes(job.status));

      UI.completedList.replaceChildren();
      UI.unfinishedList.replaceChildren();
      UI.completedCount.textContent = String(completed.length);
      UI.completedSummaryCount.textContent = String(completed.length);
      UI.unfinishedCount.textContent = String(unfinished.length);
      UI.activeCount.textContent = String(active.length);
      UI.waitingCount.textContent = String(waiting.length);
      UI.attentionCount.textContent = String(attention.length);
      UI.completedHistory.hidden = completed.length === 0;
      if (completed.length === 0) UI.completedHistory.open = false;
      UI.clearCompletedBtn.disabled = completed.length === 0;
      UI.warning.hidden = !_jobs.some(job => job.status === 'running' || job.status === 'stopping');

      if (completed.length > 0) {
        completed.forEach(job => {
          const index = _jobs.findIndex(item => item.id === job.id);
          UI.completedList.appendChild(createJobCard(job, index));
        });
      }

      if (unfinished.length === 0) {
        UI.unfinishedList.appendChild(emptyState(_jobs.length === 0
          ? '目前沒有匯出工作。'
          : '所有工作都已完成。'));
      } else {
        unfinished.forEach(job => {
          const index = _jobs.findIndex(item => item.id === job.id);
          UI.unfinishedList.appendChild(createJobCard(job, index));
        });
      }
    }

    let dragSrcEl = null;
    function handleDragStart(e) {
      _isDragging = true;
      dragSrcEl = this;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', this.dataset.jobId);
      this.classList.add('dragging');
    }
    function handleDragEnter(e) {
      if (e.preventDefault) e.preventDefault();
    }
    function handleDragOver(e) {
      if (e.preventDefault) e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (this !== dragSrcEl && this.dataset.status === 'queued') {
        const rect = this.getBoundingClientRect();
        const relY = e.clientY - rect.top;
        if (relY < rect.height / 2) {
          this.classList.add('drop-above');
          this.classList.remove('drop-below');
        } else {
          this.classList.add('drop-below');
          this.classList.remove('drop-above');
        }
      }
      return false;
    }
    function handleDragLeave(e) {
      this.classList.remove('drop-above', 'drop-below');
    }
    async function handleDrop(e) {
      if (e.stopPropagation) e.stopPropagation();
      this.classList.remove('drop-above', 'drop-below');
      if (!dragSrcEl) return false;
      if (dragSrcEl !== this && this.dataset.status === 'queued') {
        const srcId = dragSrcEl.dataset.jobId;
        const targetId = this.dataset.jobId;
        
        const rect = this.getBoundingClientRect();
        const relY = e.clientY - rect.top;
        const insertAfter = relY >= rect.height / 2;
        
        const srcAbsoluteIdx = _jobs.findIndex(j => j.id === srcId);
        let targetAbsoluteIdx = _jobs.findIndex(j => j.id === targetId);
        
        if (insertAfter) targetAbsoluteIdx++;
        if (srcAbsoluteIdx < targetAbsoluteIdx) targetAbsoluteIdx--;
        
        await window.queueAPI.reorderJob(srcId, targetAbsoluteIdx);
        loadData();
      }
      return false;
    }
    function handleDragEnd(e) {
      _isDragging = false;
      this.classList.remove('dragging');
      UI.board.querySelectorAll('.job').forEach(el => el.classList.remove('drop-above', 'drop-below'));
      renderJobs(); // catch up with any missed updates
    }

    async function loadData() {
      const data = await window.queueAPI.getAll();
      _jobs = data.jobs;
      _isPaused = data.isPaused;
      
      if (_isPaused) {
        UI.pauseBtn.textContent = '▶ 繼續佇列';
        UI.pauseBtn.classList.add('primary');
      } else {
        UI.pauseBtn.textContent = '⏸ 暫停佇列';
        UI.pauseBtn.classList.remove('primary');
      }
      
      UI.concurrencySel.value = data.concurrency;
      renderJobs();
    }

    UI.pauseBtn.onclick = async () => {
      await window.queueAPI.setPause(!_isPaused);
      loadData();
    };

    UI.showMainWindowBtn.onclick = () => {
      window.queueAPI.showMainWindow();
    };

    UI.clearCompletedBtn.onclick = async () => {
      await window.queueAPI.clearCompleted();
      loadData();
    };

    UI.concurrencySel.onchange = async () => {
      await window.queueAPI.setConcurrency(parseInt(UI.concurrencySel.value));
    };

    window.queueAPI.onUpdate(() => {
      loadData();
    });

    loadData();
  </script>
</body>
</html>
