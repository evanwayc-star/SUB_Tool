<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>字幕比對</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-raised: #334155;
      --border: #475569;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --accent: #3b82f6;
      --diff-time: #38bdf8;
      --diff-text: #22c55e;
      --diff-style: #c084fc;
      --missing-bg: #0b1120;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; min-height: 100vh; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column;
    }
    .header {
      display: flex; align-items: center; gap: 24px; padding: 16px 24px;
      background: rgba(30, 41, 59, .94); border-bottom: 1px solid var(--border);
    }
    .track-select-group { flex: 1; display: grid; gap: 6px; min-width: 0; }
    label { color: var(--text-dim); font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
    select {
      appearance: none; width: 100%; border: 1px solid var(--border); border-radius: 6px;
      background: var(--surface-raised); color: var(--text); padding: 9px 12px; font: inherit; cursor: pointer;
    }
    select:focus { outline: 2px solid rgba(59,130,246,.5); outline-offset: 1px; }
    .controls {
      display: grid; gap: 10px; justify-items: center; padding: 8px 14px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
    }
    .toggles { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .pill-toggle {
      border: 1px solid rgba(255,255,255,.12); border-radius: 999px; background: transparent;
      color: var(--text-dim); cursor: pointer; font: inherit; font-size: 12px; padding: 5px 10px;
    }
    .pill-toggle.active { color: var(--text); background: rgba(59,130,246,.17); border-color: rgba(59,130,246,.45); }
    .checkbox-wrap { display: flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 12px; text-transform: none; letter-spacing: 0; cursor: pointer; }
    .scroll-container {
      flex: 1; overflow: auto; display: grid; grid-template-columns: minmax(0,1fr) 48px minmax(0,1fr);
      align-content: start;
    }
    .cell {
      position: relative; min-height: 78px; padding: 12px 16px; cursor: pointer;
      background: rgba(15,23,42,.82); border-bottom: 1px solid var(--border);
    }
    .cell:hover { background: var(--surface-raised); }
    .cell.has-diff { background: rgba(59,130,246,.14); }
    .cell.has-diff:hover { background: rgba(59,130,246,.25); }
    .cell.missing { background: var(--missing-bg); cursor: default; }
    .tc { margin-bottom: 6px; color: var(--text-dim); font-family: ui-monospace, Consolas, monospace; font-size: 13px; letter-spacing: .03em; }
    .txt { color: var(--text); font-size: 16px; font-weight: 500; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
    .badge { display: inline-block; margin-right: 6px; padding: 2px 6px; border: 1px solid rgba(255,255,255,.08); border-radius: 4px; background: rgba(0,0,0,.25); font-size: 11px; }
    .icons {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      background: var(--surface); border-right: 1px solid var(--border); border-left: 1px solid var(--border); border-bottom: 1px solid var(--border);
    }
    .icon { width: 23px; height: 23px; border-radius: 6px; display: grid; place-items: center; color: var(--border); font-size: 13px; }
    .icon.active-time { color: var(--diff-time); background: rgba(56,189,248,.15); }
    .icon.active-text { color: var(--diff-text); background: rgba(34,197,94,.15); }
    .icon.active-style { color: var(--diff-style); background: rgba(192,132,252,.15); }
    #emptyState {
      grid-column: 1 / -1; display: grid; place-items: center; min-height: 220px; padding: 40px;
      color: var(--text-dim); text-align: center; font-size: 14px;
    }
    .context-menu {
      display: none; position: fixed; z-index: 10; padding: 4px; border: 1px solid var(--border); border-radius: 7px;
      background: rgba(30,41,59,.98); box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }
    .context-menu.show { display: block; }
    .menu-item { padding: 8px 12px; border-radius: 4px; color: var(--text); cursor: pointer; font-size: 13px; }
    .menu-item:hover { background: var(--surface-raised); }
    .diff-fragment { color: #f87171; font-weight: 700; background: rgba(239,68,68,.15); border-radius: 2px; padding: 0 2px; }
    @media (max-width: 740px) {
      .header { gap: 10px; padding: 10px; }
      .controls { padding: 6px; }
      .toggles { gap: 4px; }
      .pill-toggle { padding: 4px 7px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="track-select-group">
      <label for="selA">左側軌道</label>
      <select id="selA"></select>
    </div>
    <div class="controls">
      <div class="toggles">
        <button id="toggleTime" class="pill-toggle active" type="button">◷ 時間</button>
        <button id="toggleText" class="pill-toggle active" type="button">✎ 內容</button>
        <button id="toggleStyle" class="pill-toggle active" type="button">✦ 樣式</button>
      </div>
      <label class="checkbox-wrap"><input type="checkbox" id="hideIdentical"> 隱藏無差異字幕</label>
    </div>
    <div class="track-select-group">
      <label for="selB">右側軌道</label>
      <select id="selB"></select>
    </div>
  </header>

  <main class="scroll-container" id="container">
    <div id="emptyState">載入中…</div>
  </main>

  <div id="ctxMenu" class="context-menu">
    <div class="menu-item" id="miMatchStyle">🎨 匹配另一側樣式</div>
  </div>

  <script>
    let payload = null;
    let plan = null;
    let ctxTarget = null;
    const checks = { time: true, text: true, style: true };
    const container = document.getElementById('container');
    const selA = document.getElementById('selA');
    const selB = document.getElementById('selB');
    const hideIdentical = document.getElementById('hideIdentical');
    const ctxMenu = document.getElementById('ctxMenu');

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function highlightDiff(first, second) {
      const left = escapeHtml(first);
      const right = escapeHtml(second);
      if (left === right) return { left, right };
      let start = 0;
      while (start < left.length && start < right.length && left[start] === right[start]) start += 1;
      let leftEnd = left.length - 1;
      let rightEnd = right.length - 1;
      while (leftEnd >= start && rightEnd >= start && left[leftEnd] === right[rightEnd]) {
        leftEnd -= 1;
        rightEnd -= 1;
      }
      const mark = value => value ? '<span class="diff-fragment">' + value + '</span>' : '';
      return {
        left: left.slice(0, start) + mark(left.slice(start, leftEnd + 1)) + left.slice(leftEnd + 1),
        right: right.slice(0, start) + mark(right.slice(start, rightEnd + 1)) + right.slice(rightEnd + 1),
      };
    }

    function cellHtml(cue, number, hasDiff, startHtml, endHtml, textHtml, sourceCueId) {
      if (!cue) return '<div class="cell missing"></div>';
      const source = sourceCueId ? ' data-source-cue-id="' + escapeHtml(sourceCueId) + '"' : '';
      const badge = number == null ? '' : '<span class="badge">#' + number + '</span>';
      return '<div class="cell ' + (hasDiff ? 'has-diff' : '') + '" data-cue-id="' + escapeHtml(cue.id) + '"' + source + '>'
        + '<div class="tc">' + badge + startHtml + ' → ' + endHtml + '</div>'
        + '<div class="txt">' + textHtml + '</div></div>';
    }

    function emptyState(message) {
      container.innerHTML = '<div id="emptyState">' + escapeHtml(message) + '</div>';
    }

    function renderRows() {
      if (!plan || !plan.selection) {
        emptyState('請選擇要比對的軌道');
        return;
      }
      if (!plan.rows.length) {
        emptyState('兩個軌道皆無字幕');
        return;
      }
      let html = '';
      for (const row of plan.rows) {
        if (hideIdentical.checked && !row.active.any) continue;
        const start = highlightDiff(row.left && row.left.startTimecode, row.right && row.right.startTimecode);
        const end = highlightDiff(row.left && row.left.endTimecode, row.right && row.right.endTimecode);
        const text = highlightDiff(row.left && row.left.text, row.right && row.right.text);
        const hasDiff = row.active.any;
        const styleTitle = row.difference.style
          ? '不同的屬性: ' + row.difference.styleKeys.join(', ')
          : '';
        const leftSource = row.active.style && row.right ? row.right.id : null;
        const rightSource = row.active.style && row.left ? row.left.id : null;
        html += cellHtml(row.left, row.leftIndex, hasDiff, start.left, end.left, text.left, leftSource);
        html += '<div class="icons">'
          + '<div class="icon ' + (row.active.time ? 'active-time' : '') + '" title="' + (row.active.time ? '時間不同' : '') + '">◷</div>'
          + '<div class="icon ' + (row.active.text ? 'active-text' : '') + '" title="' + (row.active.text ? '內容不同' : '') + '">✎</div>'
          + '<div class="icon ' + (row.active.style ? 'active-style' : '') + '" title="' + escapeHtml(row.active.style ? styleTitle : '') + '">✦</div>'
          + '</div>';
        html += cellHtml(row.right, row.rightIndex, hasDiff, start.right, end.right, text.right, rightSource);
      }
      container.innerHTML = html || '<div id="emptyState">無差異字幕</div>';
    }

    function setToggle(button, active) {
      button.classList.toggle('active', active);
    }

    function setTrackOptions(tracks) {
      for (const select of [selA, selB]) {
        select.replaceChildren();
        for (const track of tracks) {
          const option = document.createElement('option');
          option.value = String(track.index);
          option.textContent = track.name;
          select.appendChild(option);
        }
      }
    }

    function syncControls() {
      if (!plan) return;
      setTrackOptions(plan.tracks || []);
      if (plan.selection) {
        selA.value = String(plan.selection.leftTrack);
        selB.value = String(plan.selection.rightTrack);
      }
      checks.time = plan.checks.time;
      checks.text = plan.checks.text;
      checks.style = plan.checks.style;
      setToggle(document.getElementById('toggleTime'), checks.time);
      setToggle(document.getElementById('toggleText'), checks.text);
      setToggle(document.getElementById('toggleStyle'), checks.style);
    }

    function sendSelection() {
      if (!payload || !window.subtool || !window.subtool.sendCommand) return;
      window.subtool.sendCommand({
        type: 'select',
        revision: payload.revision,
        leftTrack: Number(selA.value),
        rightTrack: Number(selB.value),
        checks: { time: checks.time, text: checks.text, style: checks.style },
      });
    }

    if (window.subtool) {
      window.subtool.onUpdateData(nextPayload => {
        if (!nextPayload || !nextPayload.plan) return;
        payload = nextPayload;
        plan = nextPayload.plan;
        syncControls();
        renderRows();
      });
    }

    selA.addEventListener('change', sendSelection);
    selB.addEventListener('change', sendSelection);
    hideIdentical.addEventListener('change', renderRows);
    document.getElementById('toggleTime').addEventListener('click', () => { checks.time = !checks.time; sendSelection(); });
    document.getElementById('toggleText').addEventListener('click', () => { checks.text = !checks.text; sendSelection(); });
    document.getElementById('toggleStyle').addEventListener('click', () => { checks.style = !checks.style; sendSelection(); });

    container.addEventListener('click', event => {
      const cell = event.target.closest('.cell[data-cue-id]');
      if (!cell || !payload || !window.subtool?.sendCommand) return;
      window.subtool.sendCommand({ type: 'seek', revision: payload.revision, cueId: cell.dataset.cueId });
    });

    container.addEventListener('contextmenu', event => {
      const cell = event.target.closest('.cell[data-source-cue-id]');
      if (!cell || !payload) return;
      event.preventDefault();
      ctxTarget = { targetCueId: cell.dataset.cueId, sourceCueId: cell.dataset.sourceCueId };
      ctxMenu.style.left = event.clientX + 'px';
      ctxMenu.style.top = event.clientY + 'px';
      ctxMenu.classList.add('show');
    });

    document.addEventListener('click', event => {
      if (!ctxMenu.contains(event.target)) ctxMenu.classList.remove('show');
    });

    document.getElementById('miMatchStyle').addEventListener('click', () => {
      if (ctxTarget && payload && window.subtool?.sendCommand) {
        window.subtool.sendCommand({
          type: 'match-style',
          revision: payload.revision,
          targetCueId: ctxTarget.targetCueId,
          sourceCueId: ctxTarget.sourceCueId,
        });
      }
      ctxMenu.classList.remove('show');
    });
  </script>
</body>
</html>
