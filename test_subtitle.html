<!DOCTYPE html>
<html>
<head>
<style>
.vsub-track {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  padding: 0;
}
.line {
  font-size: 30px;
  color: white;
  background: rgba(0,0,0,0.5);
  padding: 10px 20px;
  margin: -10px -20px;
  border-radius: 0.25em;
  display: inline-block;
  text-align: inherit;
  font-family: sans-serif;
  white-space: pre;
}
</style>
</head>
<body style="background: #888;">
  <div class="vsub-track" style="width: 500px;"> <!-- fixed width from JS measure -->
    <span class="line">代表作：《落日車神》 《霓虹惡魔》 </span>
  </div>
</body>
</html>
